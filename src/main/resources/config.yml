# ─────────────────────────────────────────────────────────────
#  random_mining
#  · 블럭의 경도가 주기적으로 무작위로 재배치됩니다.
#  · 채굴을 시작한 뒤 도중에 취소하면 즉사합니다.
# ─────────────────────────────────────────────────────────────

# 플러그인 로직 전체 on/off (/rm toggle 로 런타임 변경 가능)
enabled: true

# 이 월드에서만 동작. 비워두면 모든 월드에 적용.
enabled-worlds: []
# 이 월드에서는 동작하지 않음 (enabled-worlds 보다 우선)
disabled-worlds: []

# 크리에이티브 / 관전 모드 플레이어는 항상 제외됩니다.
# 이 권한을 가진 플레이어도 제외됩니다.
bypass-permission: "randommining.bypass"

hardness:
  # PER_MATERIAL : 블럭 종류별로 경도가 정해짐 (돌은 전부 같은 경도)
  # PER_BLOCK    : 좌표 하나하나마다 경도가 다름 (극한 모드)
  mode: PER_BLOCK

  # 경도 재배치 주기(초). 0 이하면 재배치하지 않음.
  reroll-interval-seconds: 120

  # 경도 배율 범위. 바닐라 채굴 시간 × 배율 = 실제 채굴 시간.
  # 로그 균등 분포라 0.2배와 5배가 같은 확률로 나옵니다.
  min-multiplier: 0.15
  max-multiplier: 10.0

  # 계산된 채굴 시간의 하한/상한 (틱, 20틱 = 1초)
  min-break-ticks: 4
  max-break-ticks: 1200

  # 바닐라 경도가 이 값 이하인 블럭(풀·횃불·꽃 등)은
  # 즉시 파괴되며 즉사 판정에서도 제외됩니다.
  instant-break-max-vanilla-hardness: 0.0

  # 이 블럭들은 바닐라 속도로 캐지며 즉사 판정도 적용되지 않습니다.
  # (채굴 자체는 여전히 이 플러그인이 처리합니다 — 그래야 부술 수 있습니다)
  exempt-materials:
    - SPAWNER

  # 재배치될 때 알림
  announce:
    chat: true
    title: true
    sound: true

death:
  # 채굴 취소 시 벌을 줄지 여부
  enabled: true

  # 채굴 시작 후 이 틱 안에 취소하면 봐줍니다 (오클릭 방지). 0 = 무자비 모드
  grace-ticks: 3

  # 채굴이 완료된 직후 이 틱 동안은 취소 신호를 무시합니다. (오탐 방지용, 건드리지 마세요)
  post-break-immunity-ticks: 20

  # 죽을 때 번개 연출(피해 없음) / 사운드
  lightning-effect: true
  sound: true

  # ── 벌은 남이 받는다 ──────────────────────────────────────────
  # 채굴을 포기하면 먼저 "전원 사망" 판정을 굴립니다.
  #   전원 사망 확률(%) = everyone-chance / (대상 인원 + 1)
  # 전원 사망이 아니면 자기 자신을 뺀 나머지 중 한 명이 룰렛으로 뽑혀 죽습니다.
  # 서버에 혼자뿐이라 대신 죽을 사람이 없으면 본인이 죽습니다.
  roulette:
    enabled: true
    everyone-chance: 100

    # 룰렛이 돌아가는 총 길이(틱). 20틱 = 1초
    spin-ticks: 60
    # 이름이 바뀌는 간격(틱). 처음엔 min, 끝으로 갈수록 max 로 느려집니다.
    min-interval-ticks: 2
    max-interval-ticks: 9
    sound: true

  # MiniMessage 문법.
  #   <player>  채굴을 포기한 사람
  #   <victim>  대신 죽은 사람          (victim 메시지에서만)
  #   <victims> 죽은 사람 전원          (everyone 메시지에서만)
  messages:
    self: "<dark_red>☠ <white><player></white> 님은 <red>채굴을 중도 포기</red>했습니다."
    victim: "<dark_red>☠ <white><player></white> 님이 채굴을 포기해 <white><victim></white> 님이 대신 죽었습니다."
    everyone: "<dark_red>☠ <white><player></white> 님이 채굴을 포기해 <red><bold>전원 사망</bold></red> — <gray><victims></gray>"

display:
  # 채굴 중 액션바에 진행도 / 경도 표시
  action-bar: true
  # 진행도 바 칸 수
  action-bar-length: 20
  # 주변 플레이어에게도 블럭 균열이 보이도록 전송
  share-crack-animation: true
  # 균열을 공유할 반경 (블럭)
  crack-share-radius: 48
